<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1526">
  <title>{{ if not .IsHome }}{{ partial "title.html" . }} · {{ end }}{{ site.Title }}</title>
  <link rel="icon" href="{{ "assets/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "assets/styles.css" | relURL }}">
  <style>
    /* Doc pages: markdown typography on top of the brand stylesheet. */
    .doc { max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem 5rem; font-family: var(--sans); color: var(--ink); }
    .doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--serif); color: var(--navy); line-height: 1.2; }
    .doc h1 { font-size: 2.2rem; margin-top: 0; }
    .doc h2 { font-size: 1.5rem; margin-top: 2.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
    .doc h3 { font-size: 1.15rem; }
    .doc a { color: var(--brass-dark); }
    .doc code { font-family: var(--mono); font-size: 0.9em; background: rgba(20, 33, 61, 0.06); padding: 0.1em 0.3em; border-radius: 3px; }
    .doc pre { background: var(--navy-deep); color: var(--cream); padding: 1rem; border-radius: 6px; overflow-x: auto; }
    .doc pre code { background: none; padding: 0; color: inherit; }
    .doc table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
    .doc th, .doc td { border: 1px solid var(--line); padding: 0.4rem 0.7rem; text-align: left; font-size: 0.95rem; }
    .doc th { background: rgba(20, 33, 61, 0.05); }
    .doc blockquote { border-left: 3px solid var(--brass); margin-left: 0; padding-left: 1rem; color: var(--muted); }
    .doc-header { background: var(--navy-deep); padding: 0.9rem 1.5rem; }
    .doc-header nav { max-width: 46rem; margin: 0 auto; display: flex; gap: 1.5rem; align-items: baseline; }
    .doc-header a { color: var(--cream); text-decoration: none; font-family: var(--sans); font-size: 0.95rem; }
    .doc-header a.wordmark-link { font-family: var(--serif); font-size: 1.1rem; }
    .doc-header a:hover { color: var(--brass-light); }
    .doc-crumbs { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-bottom: 2rem; }
    .doc-crumbs a { color: var(--muted); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="doc-header">
    <nav aria-label="Primary navigation">
      <a class="wordmark-link" href="{{ site.Home.RelPermalink }}">Exemplary Examples<sup>™</sup></a>
      {{ with site.GetPage "/training" }}<a href="{{ .RelPermalink }}">{{ partial "title.html" . }}</a>{{ end }}
    </nav>
  </header>
  <main class="doc" id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
